name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号(如 v0.1.0),留空则自动生成"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux-x86_64
            target: x86_64-unknown-linux-gnu
            bin: 1panel-cli
            artifact: 1panel-skill
          - os: ubuntu-24.04-arm
            arch: linux-aarch64
            target: aarch64-unknown-linux-gnu
            bin: 1panel-cli
            artifact: 1panel-skill-aarch64
          - os: ubuntu-latest
            arch: windows-x86_64
            target: x86_64-pc-windows-gnu
            bin: 1panel-cli.exe
            artifact: 1panel-skill-windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Windows cross-compile toolchain (mingw-w64)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            cli/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build 1panel-cli (release)
        working-directory: cli
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Assemble 1panel-skill.zip
        run: |
          set -euxo pipefail
          STAGE="1panel-skill"
          rm -rf "$STAGE" "${{ matrix.artifact }}.zip"
          mkdir -p "$STAGE/bin" "$STAGE/references"
          cp SKILL.md commands.md README.md .env.example "$STAGE/"
          cp cli/target/${{ matrix.target }}/release/${{ matrix.bin }} "$STAGE/bin/${{ matrix.bin }}"
          cp .env.example "$STAGE/bin/.env.example"
          cp references/compatibility-dev-v2.md references/api-dev-v2.json "$STAGE/references/"
          chmod +x "$STAGE/bin/${{ matrix.bin }}"
          python3 - <<'PYEOF'
          import os, zipfile
          src, out = "1panel-skill", "${{ matrix.artifact }}.zip"
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for root, _, files in os.walk(src):
                  for f in files:
                      p = os.path.join(root, f)
                      z.write(p, p)
          # 自检: zip 必须包含 SKILL.md / .env.example(bin 与根目录各一份)/ 二进制
          with zipfile.ZipFile(out) as z:
              names = set(z.namelist())
              required = {
                  "1panel-skill/SKILL.md",
                  "1panel-skill/.env.example",
                  "1panel-skill/bin/.env.example",
                  "1panel-skill/bin/${{ matrix.bin }}",
                  "1panel-skill/references/compatibility-dev-v2.md",
                  "1panel-skill/references/api-dev-v2.json",
              }
              missing = required - names
              if missing:
                  raise SystemExit(f"zip 缺少必需文件: {sorted(missing)}")
              for n in sorted(names):
                  print("  ", n)
          print(f"created {out} (自检通过)")
          PYEOF

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Determine release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(date +%Y%m%d%H%M%S)"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "1panel-cli ${{ steps.tag.outputs.tag }}"
          body: |
            ## 1panel-cli Skill Release

            - `1panel-skill.zip` — Linux x86_64
            - `1panel-skill-aarch64.zip` — Linux aarch64
            - `1panel-skill-windows.zip` — Windows x86_64

            解压后目录结构:
            ```
            1panel-skill/
            ├── SKILL.md       # skill 主体(复制到 ~/.config/opencode/skills/1panel-cli/)
            ├── commands.md    # 命令速查表
            ├── README.md
            ├── .env.example   # 面板账号配置模板(复制为 .env 并填写)
            ├── references/   # dev-v2 兼容性报告与源码 API 清单
            └── bin/
                └── 1panel-cli # 可执行文件
            ```

            本版验证基线:1Panel dev-v2(统一防火墙 API + Docker 端口守护);兼容 v2.2.5 旧防火墙接口。

            首次使用: 编辑 `.env` 填入 PANEL_URL / PANEL_USERNAME / PANEL_PASSWORD,运行 `./bin/1panel-cli doctor` 检查环境。
          files: dist/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true

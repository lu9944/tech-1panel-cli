[package]
name = "panel_cli"
version = "0.4.0"
edition = "2021"
description = "A CLI tool to login and interact with the 1Panel web panel"
license = "MIT"

[[bin]]
name = "1panel-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "cookies", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
dirs = "5"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
anyhow = "1"
percent-encoding = "2"
tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", features = ["ring"] }
http = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
